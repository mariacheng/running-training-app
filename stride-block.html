<title>Stride Block</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: single-column phone app. Bottom tab bar; full-screen overlays for the run timer, logging and day editing. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sunk:#E0E5EC; --ink:#111722; --muted:#586477; --line:#D0D7E1;
  --accent:#1E4FD8; --on-accent:#FFFFFF; --ok:#1F8A55; --warn:#B6461B; --ai:#6A48C9;
  --z-walk:#8C97A8; --z-easy:#2E9467; --z-long:#1E4FD8; --z-tempo:#D98418; --z-hard:#D23B2A; --z-race:#A9339E; --z-test:#C2560F; --z-strength:#5D5FC9; --z-cross:#0E8F9C;
  --p-base:#9DBFAE; --p-build:#E2A23A; --p-peak:#D9533F; --p-taper:#7896E6; --p-race:#111722;
  --font-display:'Saira Condensed','Arial Narrow',sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C1017; --surface:#151B25; --sunk:#1E2633; --ink:#E6EBF2; --muted:#93A0B3; --line:#2A3443;
  --accent:#6E92FF; --on-accent:#0A1022; --ok:#4CC486; --warn:#F08A55; --ai:#A68CF2;
  --z-walk:#7F8A9C; --z-easy:#4CC486; --z-long:#6E92FF; --z-tempo:#F2A643; --z-hard:#F06A57; --z-race:#E06BD5; --z-test:#F08A55; --z-strength:#9497F5; --z-cross:#3CC3CF;
  --p-base:#4F6F60; --p-build:#E2A23A; --p-peak:#E8705D; --p-taper:#6E8CE0; --p-race:#E6EBF2; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0C1017; --surface:#151B25; --sunk:#1E2633; --ink:#E6EBF2; --muted:#93A0B3; --line:#2A3443;
  --accent:#6E92FF; --on-accent:#0A1022; --ok:#4CC486; --warn:#F08A55; --ai:#A68CF2;
  --z-walk:#7F8A9C; --z-easy:#4CC486; --z-long:#6E92FF; --z-tempo:#F2A643; --z-hard:#F06A57; --z-race:#E06BD5; --z-test:#F08A55; --z-strength:#9497F5; --z-cross:#3CC3CF;
  --p-base:#4F6F60; --p-build:#E2A23A; --p-peak:#E8705D; --p-taper:#6E8CE0; --p-race:#E6EBF2; color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.05;font-weight:700}
p{margin:0}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:4px 10px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;flex:none;font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.bib{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:1px 10px 0;font-size:20px;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.bib::before,.bib::after{content:"";position:absolute;top:4px;width:4px;height:4px;border-radius:9px;background:var(--ink)}
.bib::before{left:3px}.bib::after{right:3px}
.top-sub{color:var(--muted);font-size:13px;text-align:right;min-width:0}
.top-sub b{display:block;color:var(--ink);font-family:var(--font-display);font-size:18px;line-height:1}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

.note{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sunk);border-radius:var(--r);padding:12px 14px;font-size:13px}
.note p{flex:1 1 200px;min-width:0}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ai{background:var(--ai);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.big{min-width:150px;padding:16px 28px;font-size:19px;border-radius:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.icon{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:10px;font-size:20px;line-height:1;display:grid;place-items:center;flex:none}
.icon:disabled{opacity:.35}
.linkbtn{border:0;background:none;padding:4px 0;text-decoration:underline;text-underline-offset:3px;font-size:13px;font-weight:700}

.weekhead{display:flex;align-items:center;gap:12px}
.weekhead > div{flex:1;min-width:0;text-align:center}
.weekhead h1{font-size:34px}
.weekhead h1 span{color:var(--muted);font-weight:500;font-size:24px}
.strip{display:flex;gap:3px;align-items:flex-end}
.strip button,.strip i{flex:1;height:14px;border:0;border-radius:3px;padding:0;display:block}
.strip .cut{height:9px}
.strip button.cur{outline:2px solid var(--ink);outline-offset:2px}
.ph-base{background:var(--p-base)} .ph-build{background:var(--p-build)} .ph-peak{background:var(--p-peak)} .ph-taper{background:var(--p-taper)} .ph-race{background:var(--p-race)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-size:22px}
.card > p{color:var(--muted);font-size:14px}
.card.warncard{border-color:var(--warn)}
.card.warncard h2{color:var(--warn);font-size:19px}
.coach{border-left:4px solid var(--ai)}
.card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--sunk);font-variant-numeric:tabular-nums}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.pill.ai{background:color-mix(in srgb,var(--ai) 16%,transparent);color:var(--ai)}
.pill.cut{background:color-mix(in srgb,var(--z-easy) 18%,transparent);color:var(--z-easy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.days{display:flex;flex-direction:column;gap:8px}
.rest-day{display:flex;gap:12px;align-items:center;padding:6px 4px;color:var(--muted);font-size:13px}
.dow{font-family:var(--font-display);font-weight:600;font-size:16px;width:44px;flex:none;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.dow small{display:block;font-family:var(--font-body);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:0;text-transform:none}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex}
.day .bar{width:6px;flex:none}
.day .body{flex:1;min-width:0;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.day.today{border-color:var(--ink);border-width:2px}
.dtoggle{width:100%;display:flex;gap:10px;align-items:center;border:0;background:none;padding:0;text-align:left}
.dtoggle > div:nth-child(2){flex:1;min-width:0}
.dtoggle h3{font-size:20px;font-weight:600}
.dtoggle .meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{color:var(--muted);font-size:14px;transition:transform .15s}
.dtoggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.items > li{display:flex;flex-direction:column;gap:6px;padding-top:10px;border-top:1px dashed var(--line)}
.items .ih{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.items .ih b{font-weight:700}
.items .ih i{width:10px;height:10px;border-radius:3px;flex:none}
.lines{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.how{color:var(--muted);font-size:13px}
.iacts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.done-mark{font-size:13px;font-weight:700;color:var(--ok)}
.bg-walk{background:var(--z-walk)} .bg-easy{background:var(--z-easy)} .bg-long{background:var(--z-long)} .bg-tempo{background:var(--z-tempo)} .bg-hard{background:var(--z-hard)} .bg-race{background:var(--z-race)} .bg-test{background:var(--z-test)} .bg-strength{background:var(--z-strength)} .bg-cross{background:var(--z-cross)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:0;background:none;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);min-width:0}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent)}

.calhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.calhead h1{font-size:30px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;text-align:center;color:var(--muted);font-weight:700;padding-bottom:2px}
.cal button{aspect-ratio:1/1.1;max-width:100%;border:1px solid transparent;border-radius:8px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
.cal button.out{opacity:.35}
.cal button.sel{border-color:var(--ink)}
.cal button.today b{background:var(--ink);color:var(--bg);border-radius:999px;padding:0 6px}
.cal .dots{display:flex;gap:3px;justify-content:center;min-height:8px}
.cal .dot{width:8px;height:8px;border-radius:99px}
.cal .dot.done{outline:2px solid var(--ok);outline-offset:1px}
.cal .racetag{font-family:var(--font-display);font-size:11px;font-weight:700;background:var(--z-race);color:#fff;border-radius:4px;padding:0 4px;line-height:1.3}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-width:0}
.tile .n{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--font-body)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.hist li:first-child{border-top:0}
.hist li > div{flex:1;min-width:0}
.hist li .sub{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.hist li q{display:block;font-size:13px;margin-top:2px;quotes:none;font-style:italic;overflow-wrap:anywhere}
.hist .x{border:0;background:none;color:var(--muted);font-size:12px;padding:4px;text-decoration:underline}

.zones{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.zones li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:baseline;font-size:14px}
.zones li i{width:12px;height:12px;border-radius:3px;align-self:center}
.zones li span{color:var(--muted);font-size:12px;display:block}
.zones li b{font-variant-numeric:tabular-nums;font-family:var(--font-display);font-size:18px;white-space:nowrap}
.lib{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lib details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.lib summary{cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700;list-style:none}
.lib summary::-webkit-details-marker{display:none}
.lib summary i{width:12px;height:12px;border-radius:3px;flex:none}
.lib summary span{flex:1}
.lib summary em{font-style:normal;color:var(--muted);font-size:12px;font-weight:400}
.lib details > div{padding-top:8px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.rules b{display:block}
.rules span{color:var(--muted);font-size:13px}

.progress{display:flex;gap:4px}
.progress i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.field > .lab{font-weight:700;font-size:14px}
.field .hint{font-size:12px;color:var(--muted)}
.err{font-size:13px;color:var(--warn);font-weight:700}
input[type=text],input[type=number],input[type=date],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:110px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:400}
.seg button[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.navrow{display:flex;gap:10px}
.navrow .btn{flex:1}
.review dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:14px}
.review dt{color:var(--muted)}
.review dd{margin:0;min-width:0;overflow-wrap:anywhere}
.weekprev{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekprev li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-size:10px;line-height:1.2;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:center}
.weekprev li b{font-family:var(--font-display);font-size:13px}
.weekprev li i{width:10px;height:10px;border-radius:3px}
.weekprev li i:not([class]){background:var(--sunk)}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ai);font-weight:700;font-size:14px}
.thinking i{width:10px;height:10px;border-radius:99px;background:var(--ai);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.25}to{opacity:1}}

.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet{z-index:55}
.pl{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px}
.pl-top{display:flex;align-items:center;gap:12px}
.pl-top > div{flex:1;min-width:0}
.pl-top h2{font-size:24px}
.timercard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 14px;display:flex;flex-direction:column;gap:16px}
.timer{display:flex;flex-direction:column;align-items:center;gap:6px;--ph:var(--muted)}
.ring{position:relative;width:min(72vw,280px);aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:14}
.ring .trk{stroke:var(--sunk)}
.ring .val{stroke:var(--ph);stroke-linecap:round}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;padding:0 24px}
.tlab{font-family:var(--font-display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ph)}
.tnum{font-family:var(--font-display);font-size:min(22vw,92px);font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.tsub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctrls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.totals{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.totals b{color:var(--ink);font-family:var(--font-display);font-size:20px;display:block}
.upnext{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.upnext li{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.upnext li i{width:10px;height:10px;border-radius:3px;flex:none}
.upnext li span{flex:1;min-width:0}
.upnext li b{font-variant-numeric:tabular-nums}
.upnext li.cur{border-color:var(--ink);border-width:2px}
.upnext li.dn{opacity:.5}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks button{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.checks .box{width:18px;height:18px;flex:none;border:2px solid var(--muted);border-radius:4px;margin-top:1px}
.checks button > span:last-child{flex:1;min-width:0}
.checks button small{display:block;color:var(--muted);font-size:12px}
.checks button[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.checks button[aria-pressed="true"]{color:var(--muted)}
.minirest{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.minirest .tnum{font-size:48px}
.pl-foot{margin-top:auto;display:flex;gap:10px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.pl-foot .btn{flex:1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);text-align:center}
@media (max-width:380px){ .tiles{grid-template-columns:1fr 1fr} .row2{grid-template-columns:1fr} }
@media (prefers-reduced-motion: reduce){ *{transition:none!important} .thinking i{animation:none} }
</style>

        w.days[d].items.push(it);
      }
      if (isCut) cutIdx++;

      crossDays.forEach((d, x) => {

      need -= w.days.filter(dd => dd.items.some(it => it.type === 'strength')).length;

      const spots = [...easyDays, ...crossDays.filter(d => !w.days[d].items.some(it => it.type === 'strength')), ...others.filter(d => !easyDays.includes(d) && d !== qd)];

  const wkKm = w => w.days.reduce((t, d) => t + d.items.reduce((u, it) => u + runKm(it, P, p), 0), 0);
  let lastFull = Math.max(+p.weekly || 0, 0);
  for (const w of weeks) {
    if (w.i >= m) break;
    const km = wkKm(w);

/* ---------- workouts: segments, distances, descriptions ---------- */
function segs(it, P, p) {
  const out = [], add = (z, sec, label, extra) => out.push({ z, sec: Math.max(1, Math.round(sec)), label, ...(extra || {}) });
  switch (it.type) {
    case 'easy': case 'long': case 'shakeout': {
      const runSec = it.km * P.easy;
      if (it.rw) {
        add('walk', 300, 'Warm-up walk');
        const r = it.rw.run * 60, w = it.rw.walk * 60, reps = Math.max(2, Math.round(runSec * 1.08 / (r + w)));
        for (let x = 0; x < reps; x++) { add(it.type === 'long' ? 'long' : 'easy', r, `Run ${x + 1} of ${reps}`); if (x < reps - 1) add('walk', w, 'Walk'); }
        add('walk', 300, 'Cool-down walk');
      } else {
        if (p.freq === 'new') add('walk', 180, 'Warm-up walk');
        add(it.type === 'long' ? 'long' : 'easy', runSec, it.type === 'long' ? 'Long run' : 'Easy run');
        for (let x = 0; x < (it.strides || 0); x++) { add('stride', 20, `Stride ${x + 1}`); add('walk', 60, 'Walk back'); }
      }
      break;
    }
    case 'tempo': add('jog', 600, 'Warm-up jog'); add('tempo', it.min * 60, 'Tempo'); add('jog', 600, 'Cool-down jog'); break;
    case 'intervals':
      add('jog', 600, 'Warm-up jog');
      for (let x = 0; x < it.reps; x++) { add('hard', it.work, `Rep ${x + 1} of ${it.reps}`); if (x < it.reps - 1) add('jog', it.rec, 'Easy jog'); }
      add('jog', 600, 'Cool-down jog'); break;
    case 'racepace':
      add('jog', 600, 'Warm-up jog');
      if (it.km) add('race', it.km * P.race, `${fmtDist(it.km)} at race pace`);
      else for (let x = 0; x < it.n; x++) { add('race', it.min * 60, `Race pace ${x + 1} of ${it.n}`); if (x < it.n - 1) add('jog', 180, 'Easy jog'); }
      add('jog', 600, 'Cool-down jog'); break;
    case 'test':
      add('jog', 600, 'Warm-up jog');
      for (let x = 0; x < 3; x++) { add('stride', 20, 'Stride'); add('walk', 40, 'Walk'); }
      add('test', 5 * P.hard, 'Run 5K, tap Done at the finish', { open: true });
      add('walk', 300, 'Cool-down walk'); break;
    case 'cross': add('cross', it.min * 60, CROSS[it.act] || 'Cross-training'); break;
    case 'race': add('race', DIST[p.distance].km * P.race, DIST[p.distance].label + ', tap Done at the finish', { open: true }); break;

}
function runKm(it, P, p) {

}

const isRun = it => !['cross', 'strength'].includes(it.type);
function describe(it, P, p) {
  const L = [], km = runKm(it, P, p), sec = segSec(it, P, p);

    case 'easy': case 'long': case 'shakeout':
      if (it.rw) { const sg = segs(it, P, p); const reps = sg.filter(s => s.z !== 'walk').length; L.push(`Run ${it.rw.run} min, walk ${it.rw.walk} min, × ${reps}`, `5 min walk to warm up and cool down`, `Run at ${paceTxt('easy', P)}`); }

      if (it.strides) L.push(`Then ${it.strides} × 20 s strides (${EFFORT.stride}), walk back between`);
      if (it.type === 'long' && sec > 75 * 60) L.push('Fuel: carry water and take a gel or snack every 30–45 min. Practise what you\'ll use on race day.');
      if (it.medium) L.push('A second, shorter long run. Common in marathon plans to build endurance midweek.');
      break;
    case 'tempo': L.push('10 min easy warm-up', `${it.min} min tempo at ${paceTxt('tempo', P)}`, '10 min easy cool-down'); break;
    case 'intervals': L.push('10 min easy warm-up', `${it.reps} × 3 min hard at ${paceTxt('hard', P)}`, '2 min easy jog between reps', '10 min easy cool-down'); break;
    case 'racepace':
      L.push('10 min easy warm-up');
      L.push(it.km ? `${fmtDist(it.km)} at race pace (${paceTxt('race', P)})` : `${it.n} × ${it.min} min at race pace (${paceTxt('race', P)}), 3 min easy between`);
      L.push('10 min easy cool-down'); break;
    case 'test': L.push('10 min easy warm-up and 3 strides', 'Run 5K at the hardest pace you can hold evenly', 'Log your time: it updates your training paces'); meta = `~${fmtDist(7.5)} total · ~${fmtMin(sec)}`; break;
    case 'strength': { const mv = strengthMoves(p); L.push(`${it.rounds || 2} rounds of ${mv.length} moves, about 1 min each`, mv.map(id => MOVES[id].name).join(', ')); if (it.gym) L.push('Your gym day. Add weights if you\'re used to them.'); break; }
    case 'cross': L.push(`${it.min} min, easy to moderate`); if (it.act === 'climb') L.push('Counts as cross-training. Keep it to moderate climbing when a long run is the next day.'); break;

      L.push('Nothing new: same shoes, kit, breakfast and gels you trained with.', 'Drink at the early aid stations, before you feel thirsty.');

}

  let x = 0;

    for (const it of d.items) {

const allDays = () => S.weeks.flatMap(w => w.days);
const dayByDate = s => allDays().find(d => d.date === s);

function weekLogged(w) { return S.history.filter(h => h.planId === S.profile.planId && h.date >= w.days[0].date && h.date <= w.days[6].date); }

  data.forEach((d, i) => {
    const x = L + 2 + i * bw, wdt = Math.max(2, bw - 3);
    svg += `<rect x="${x}" y="${y(d.plan)}" width="${wdt}" height="${y(0) - y(d.plan)}" fill="var(--sunk)" stroke="var(--line)" stroke-width="1" rx="2"/>`;

${logs || '(none)'}

const AI_ERR = {

/* ---------- audio, vibration, wake lock ---------- */
let AC = null, WL = null;

/* ---------- player: timer, strength circuit, log ---------- */
let P = null, TI = null;
const RING_C = 2 * Math.PI * 88;
function openPlayer(item, date, quick) {
  const p = S.profile;

  if (P.mode === 'timer') { const sg = segs(item, S.P, p); P.t = { segs: sg, i: 0, remain: sg[0].sec * 1000, up: 0, running: false, elapsed: 0, last: 0, lastSec: null }; }

  document.body.classList.add('noscroll');

}
function openLog(item, date, quick) { openPlayer(item, date, quick); toLog(0); }

function tick() {

    const t = P.t, dt = now - t.last; t.last = now; t.elapsed += dt;
    if (t.segs[t.i].open) { t.up += dt; paint(); return; }
    t.remain -= dt;
    const sec = Math.ceil(t.remain / 1000);
    if (sec !== t.lastSec) { t.lastSec = sec; if (sec <= 3 && sec > 0) beep(880, 0.12); }
    let changed = false;
    while (t.remain <= 0 && !t.segs[t.i].open) {
      if (t.i >= t.segs.length - 1) { finishTimer(); return; }
      const over = -t.remain; t.i++; t.remain = t.segs[t.i].sec * 1000 - over; t.up = 0; changed = true;
    }
    if (changed) { beep(1320, 0.4); buzz([200, 80, 200]); renderPlayer(); } else paint();
  } else if (P.mode === 'strength' && P.str.rest) {
    const left = P.str.rest.endAt - Date.now();

}

  if (val) val.style.strokeDashoffset = sg.open ? 0 : RING_C * (1 - clamp(t.remain / (sg.sec * 1000), 0, 1));

  if (k === 'runDays') { d.runDays = v.map(Number).sort((a, b) => a - b); if (!d.runDays.includes(+d.longDay)) d.longDay = d.runDays[d.runDays.length - 1] ?? 6; d.crossDays = (d.crossDays || []).filter(x => !d.runDays.includes(+x)); }
  if (k === 'crossDays') d.crossDays = v.map(Number);
  if (k === 'crossDays' && d.crossDays.length && !(d.crossActs || []).length) d.crossActs = ['bike'];
  if (d.ai && k !== 'aiOn') d.aiStale = true;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  switch (a) {
    case 'tab': S.view = v; if (v === 'setup') { S.draft = null; S.step = 0; S.aiErr = ''; } if (v === 'calendar') { S.calSel = S.calSel || todayISO(); } render(); window.scrollTo(0, 0); break;
    case 'newplan': S.draft = blankProfile(); S.draft.__new = true; S.step = 0; render(); window.scrollTo(0, 0); break;
    case 'wk': S.week = clamp(S.week + +v, 0, S.weeks.length - 1); render(); break;
    case 'week': S.week = +v; render(); break;
    case 'dtoggle': S.open[b.dataset.d] = !(S.open[b.dataset.d] ?? false); render(); break;
    case 'month': { const m = parseISO(S.calMonth); S.calMonth = iso(new Date(m.getFullYear(), m.getMonth() + +v, 1)); render(); break; }
    case 'calsel': S.calSel = v; render(); break;
    case 'start': { const it = itemAt(b.dataset.d, b.dataset.i); if (it) openPlayer(it, b.dataset.d); break; }
    case 'log': { const it = itemAt(b.dataset.d, b.dataset.i); if (it) openLog(it, b.dataset.d); break; }
    case 'quick': { const q = QUICK.find(x => x[0] === v); if (q) openPlayer(clone(q[1]), todayISO(), true); break; }
    case 'move': openMove(b.dataset.d); break;
    case 'hdel':
      if (S.delArm === v) { S.history = S.history.filter(h => h.id !== v); S.delArm = null; save(); toast('Deleted'); }
      else { S.delArm = v; setTimeout(() => { if (S.delArm === v) { S.delArm = null; if (S.view === 'progress') render(); } }, 3000); }
      render(); break;
    // setup
    case 'seg':
      if (b.dataset.k) {
        let val = v === 'true' ? true : v === 'false' ? false : NUMKEYS.includes(b.dataset.k) ? Number(v) : v;
        setDraft(b.dataset.k, val); render();
      } else if (b.dataset.pr != null && P) { P.str.round = +v; renderPlayer(); }
      else if (b.dataset.lseg && P) { const k = b.dataset.lseg; P.log[k] = v === 'true' ? true : v === 'false' ? false : v; renderPlayer(); }
      break;
    case 'chip': {
      const k = b.dataset.k, arr = [...(S.draft[k] || [])].map(String), i = arr.indexOf(String(v));
      if (i >= 0) arr.splice(i, 1); else arr.push(String(v));
      const numeric = k === 'runDays' || k === 'crossDays';
      setDraft(k, numeric ? arr.map(Number) : arr); render(); break;
    }
    case 'step': S.step = clamp(S.step + +v, 0, STEPS.length - 1); render(); window.scrollTo(0, 0); break;
    case 'skip': if (S.step === 5) { S.draft.testMode = 'effort'; } S.step = clamp(S.step + 1, 0, STEPS.length - 1); render(); window.scrollTo(0, 0); break;
    case 'aiask': askCoach(); break;
    case 'aistop': if (S.aiCtl) S.aiCtl.abort(); break;
    case 'build': {
      const d = S.draft, fresh = d.__new || S.profile.example || d.keepDone === false;
      delete d.__new; delete d.keepDone;
      d.example = false;
      if (fresh) { d.planId = 'p' + Date.now(); d.swaps = []; }
      S.history = S.history.filter(h => !h.example);
      S.profile = d; S.draft = null; S.step = 0; S.view = 'plan'; S.open = {};
      recompute(true); save(); render(); window.scrollTo(0, 0); toast('Your plan is ready');
      break;
    }
    // player
    case 'pclose':
      if (P && P.mode === 'timer' && P.t.elapsed > 0 && !P.quitArm) { P.quitArm = true; toast('Tap × again to quit without logging'); setTimeout(() => { if (P) P.quitArm = false; }, 3000); break; }
      closePlayer(); break;
    case 'pplay': {
      ensureAudio(); const t = P.t;
      if (t.running) { t.running = false; wakeOff(); }
      else { t.running = true; t.last = performance.now(); wakeOn(); beep(990, 0.2); }
      renderPlayer(); break;
    }
    case 'pnext': {
      const t = P.t;
      if (t.i >= t.segs.length - 1) { finishTimer(); break; }
      t.i++; t.remain = t.segs[t.i].sec * 1000; t.up = 0; t.lastSec = null; if (t.running) { beep(1320, 0.3); buzz(200); } renderPlayer(); break;
    }
    case 'pprev': { const t = P.t; t.i = Math.max(0, t.i - 1); t.remain = t.segs[t.i].sec * 1000; t.up = 0; renderPlayer(); break; }
    case 'padj': { const t = P.t, sg = t.segs[t.i]; const nr = Math.max(1000, t.remain + +v * 1000); sg.sec = Math.max(1, Math.round(sg.sec + (nr - t.remain) / 1000)); t.remain = nr; renderPlayer(); break; }
    case 'pfinish':
      if (P.mode === 'timer') { P.t.running = false; finishTimer(); }
      else toLog(Math.round((Date.now() - P.str.startedAt) / 1000));
      break;
    case 'scheck': {
      ensureAudio(); const s = P.str, k = s.round + ':' + v; s.checks[k] = !s.checks[k];
      const mv = strengthMoves(S.profile);
      if (mv.every(id => s.checks[s.round + ':' + id]) && s.checks[k]) {
        if (s.round < s.rounds - 1) { s.round++; s.rest = { endAt: Date.now() + 90000 }; beep(990, 0.2); }
        else toast('Circuit done. Tap Finish & log.');
      }
      renderPlayer(); break;
    }
    case 'srestskip': P.str.rest = null; renderPlayer(); break;
    case 'psave': saveLog(); break;
    // move sheet
    case 'sclose': closeSheet(); break;
    case 'swap': S.profile.swaps = [...(S.profile.swaps || []), [S.sheet.date, v]]; recompute(false); save(); closeSheet(); toast('Moved'); break;
    case 'swapreset': { const ds = S.sheet.w.days.map(x => x.date); S.profile.swaps = (S.profile.swaps || []).filter(([x, y]) => !ds.includes(x) && !ds.includes(y)); recompute(false); save(); closeSheet(); toast('Moves undone'); break; }
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.k && S.draft) {
    let v = el.value;
    if (el.dataset.dist) v = v === '' ? 0 : Math.round(toKm(+v, S.draft.unit) * 100) / 100;
    S.draft[el.dataset.k] = v;
    if (S.draft.ai) S.draft.aiStale = true;
  }
  if (el.dataset.lk && P && P.log) P.log[el.dataset.lk] = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.k && el.dataset.re && S.view === 'setup') { const id = el.id; render(); const n = id && document.getElementById(id); if (n && n.tagName === 'SELECT') n.focus(); }
});

load();
render();
initSample();
</script>
